<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de Encomendas — Di Mercatto</title>
<meta name="theme-color" content="#94392D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{--vinho:#94392D;--vinho-escuro:#6E271E;--creme:#FFEDDC;--creme-claro:#FFF7EF;--laranja:#E07F40;--dourado:#B8913A;--texto:#2E211B;--suave:#5C4A40;--borda:#E8D3C0;--erro:#B3261E;--ok:#2F5D46}
  *{box-sizing:border-box}
  body{margin:0;background:var(--creme-claro);color:var(--texto);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  header{background:var(--vinho);color:#fff}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap}
  .marca{font-family:"Great Vibes",cursive;font-size:30px;line-height:1}
  .marca small{font-family:Montserrat,sans-serif;font-size:14px;font-weight:600;margin-left:8px;opacity:.85}
  header .usuario{font-size:14px;display:flex;gap:10px;align-items:center}
  header .usuario button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600}
  nav.abas{background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:5}
  nav.abas .wrap{display:flex;gap:4px;overflow-x:auto}
  nav.abas button{border:0;background:none;padding:14px 16px;font-weight:700;color:var(--suave);border-bottom:3px solid transparent;white-space:nowrap}
  nav.abas button[aria-selected=true]{color:var(--vinho);border-bottom-color:var(--vinho)}
  main{padding:18px 0 60px}
  h1{font-size:24px;color:var(--vinho);margin:4px 0 14px}
  h2{font-size:19px;color:var(--vinho);margin:0 0 10px}
  .card{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:16px;margin-bottom:14px}
  .barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
  .barra-acoes .cresce{flex:1;min-width:180px}
  label{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
  .dica{font-weight:500;color:var(--suave);font-size:13px}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;min-height:44px;border:1.5px solid var(--borda);border-radius:10px;padding:8px 10px;background:#fff}
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vinho);box-shadow:0 0 0 3px rgba(148,57,45,.15)}
  .btn{min-height:44px;border-radius:10px;border:1.5px solid var(--vinho);background:var(--vinho);color:#fff;font-weight:700;padding:0 16px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
  .btn.sec{background:#fff;color:var(--vinho)}
  .btn.peq{min-height:36px;padding:0 12px;font-size:14px}
  .btn.perigo{background:#fff;color:var(--erro);border-color:var(--erro)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--borda);vertical-align:top}
  th{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--suave)}
  td.num,th.num{text-align:right;white-space:nowrap}
  .tabela{overflow-x:auto}
  .tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--creme);color:var(--vinho)}
  .tag.off{background:#eee;color:#666}
  .st-aguardando{background:#FFF3C4;color:#5A4500}.st-confirmado{background:#DCEFE3;color:#1E5A36}.st-preparacao{background:#E3ECFA;color:#1F3F78}
  .st-pronto{background:#E6F4F1;color:#14594B}.st-saiu{background:#EDE6F7;color:#4A2C7A}.st-concluido{background:#E8E8E8;color:#333}.st-cancelado{background:#FDECEA;color:var(--erro)}
  .pedido{border:1px solid var(--borda);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .pedido .topo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
  .pedido .num{font-weight:700;font-size:17px;color:var(--vinho)}
  .pedido .meta{color:var(--suave);font-size:14px}
  .pedido details{margin-top:8px}
  .pedido summary{cursor:pointer;font-weight:600;color:var(--vinho)}
  .msg{border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600}
  .msg.erro{background:#FDECEA;color:var(--erro)}
  .msg.ok{background:#DCEFE3;color:#1E5A36}
  .msg.info{background:#FFF3C4;color:#5A4500}
  .login{max-width:420px;margin:40px auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--creme);border-radius:999px;padding:6px 6px 6px 12px;font-weight:600;font-size:14px}
  .chip button{border:0;background:#fff;border-radius:50%;width:24px;height:24px;line-height:1;font-weight:700;color:var(--vinho)}
  .linha-add{display:flex;gap:8px}
  .linha-add > *:first-child{flex:1}
  dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100% - 24px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(30,20,15,.45)}
  dialog form{padding:18px}
  dialog .rodape{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .check{display:flex;gap:8px;align-items:center;font-weight:600}
  .check input{width:20px;height:20px;accent-color:var(--vinho)}
  .icone-cat{display:inline-flex;vertical-align:middle;color:var(--vinho);margin-right:6px}
  .cab-setor{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:18px;color:var(--vinho);font-weight:700}
  .vazio{color:var(--suave);padding:20px 0;text-align:center}
  .faixa-prod{border:2px solid var(--vinho);border-radius:14px;padding:4px 14px 12px;margin:16px 0;break-inside:avoid-page}
  .faixa-cab{font-size:20px;font-weight:800;color:var(--vinho);margin:10px 0 0}
  .faixa-cab span{font-size:14px;font-weight:600;color:var(--suave);margin-left:8px}
  @media print{.faixa-prod{border-width:1.5px;border-color:#000}.faixa-cab{color:#000}}
  #alerta{position:fixed;right:16px;bottom:16px;z-index:50;background:#1E7B45;color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:340px;font-weight:600}
  #alerta button{margin-top:10px;margin-right:6px}
  #somAviso{font-size:13px}
  [hidden]{display:none!important}
  /* Fichas de pedido para impressão */
  #areaImpressao{display:none}
  .ficha{font-family:Montserrat,Arial,sans-serif;color:#000;font-size:11pt;line-height:1.35}
  .ficha .cab{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
  .ficha .loja{font-family:"Great Vibes",cursive;font-size:26pt;line-height:1}
  .ficha .loja small{display:block;font-family:Montserrat,Arial,sans-serif;font-size:9pt;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .ficha .numero{text-align:right}
  .ficha .numero b{display:block;font-size:20pt;letter-spacing:.5px}
  .ficha .colunas{display:grid;grid-template-columns:38% 1fr;gap:14px;align-items:start}
  .ficha .campos.duas{grid-template-columns:1fr 1fr}
  .ficha .assin{grid-template-columns:1fr 1fr 1fr}
  .ficha .secao:first-child{margin-top:0}
  .ficha .alterado{border:2px dashed #000;padding:6px 10px;margin-bottom:8px;font-weight:700;font-size:10.5pt}
  .ficha .destaque{border:2px solid #000;border-radius:6px;padding:8px 10px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;font-size:13pt;font-weight:700}
  .ficha .secao{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:#e6e6e6;border:1px solid #000;border-bottom:0;padding:3px 8px;margin-top:10px}
  .ficha .campos{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #000;border-right:0;border-bottom:0}
  .ficha .campo{border-right:1px solid #000;border-bottom:1px solid #000;padding:4px 8px 6px;min-height:42px}
  .ficha .campo span{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.4px;color:#333}
  .ficha .campo b{font-size:11pt}
  .ficha .c2{grid-column:span 2}.ficha .c3{grid-column:span 3}.ficha .c4{grid-column:span 4}
  .ficha table{width:100%;border-collapse:collapse;font-size:10.5pt}
  .ficha th{border:1px solid #000;background:#f2f2f2;font-size:8pt;text-transform:uppercase;letter-spacing:.4px;color:#000;padding:4px 5px;text-align:left}
  .ficha td{border:1px solid #000;padding:6px 5px;vertical-align:top}
  .ficha td.ck{width:26px;text-align:center}
  .ficha td.num,.ficha th.num{text-align:right;white-space:nowrap}
  .ficha .caixa{display:inline-block;width:13px;height:13px;border:1.5px solid #000;vertical-align:middle}
  .ficha .obs-item{font-size:9.5pt;font-style:italic;margin-top:2px}
  .ficha tr.tot td{font-size:12.5pt;font-weight:700;background:#f2f2f2}
  .ficha .assin{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #000;border-right:0}
  .ficha .assin div{border-right:1px solid #000;padding:4px 8px;min-height:58px;font-size:8pt;text-transform:uppercase;letter-spacing:.4px}
  .ficha .assin div i{display:block;margin-top:22px;font-style:normal;text-transform:none;font-size:8.5pt;color:#333}
  .ficha .rodape{margin-top:12px;font-size:8.5pt;color:#444;display:flex;justify-content:space-between}
  @media print{
    header,nav.abas,.nao-imprimir{display:none!important}
    body{background:#fff;font-size:12pt}
    .card{border:0;padding:0}
    main{padding:0}
    body.imprimindo > *:not(#areaImpressao){display:none!important}
    body.imprimindo #areaImpressao{display:block}
    .ficha{break-after:page;page-break-after:always}
    .ficha:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="marca">Di Mercatto <small>Painel de encomendas</small></div>
    <div class="usuario" id="usuario" hidden><button type="button" id="somAviso" title="Som de aviso de pedido novo">🔔 Som: ativar</button><span id="usuarioEmail"></span><button type="button" id="btnSair">Sair</button></div>
  </div>
</header>
<nav class="abas" id="abas" hidden>
  <div class="wrap" role="tablist">
    <button type="button" role="tab" data-aba="pedidos" aria-selected="true">Pedidos</button>
    <button type="button" role="tab" data-aba="producao" aria-selected="false">Ordem de produção</button>
    <button type="button" role="tab" data-aba="produtos" aria-selected="false">Produtos</button>
    <button type="button" role="tab" data-aba="config" aria-selected="false">Configurações</button>
  </div>
</nav>
<main class="wrap" id="main"><p class="vazio">Carregando…</p></main>

<!-- Formulário de produto -->
<dialog id="dlgProduto">
  <form method="dialog" id="formProduto" novalidate>
    <h2 id="dlgProdutoTitulo">Produto</h2>
    <div class="grade">
      <div><label for="pCodigo">Código de vendas *</label><input type="text" id="pCodigo" required maxlength="30"></div>
      <div><label for="pPreco">Preço (R$) *</label><input type="text" id="pPreco" inputmode="decimal" placeholder="129,90" required></div>
    </div>
    <div style="margin-top:12px"><label for="pNome">Nome para o cliente *</label><input type="text" id="pNome" maxlength="120" required></div>
    <div style="margin-top:12px"><label for="pDesc">Descrição curta <span class="dica">opcional — aparece abaixo do nome</span></label><textarea id="pDesc" maxlength="300"></textarea></div>
    <div style="margin-top:12px"><label for="pCaixa">Descrição no caixa <span class="dica">opcional — como está no sistema da loja</span></label><input type="text" id="pCaixa" maxlength="120"></div>
    <div class="grade" style="margin-top:12px">
      <div><label for="pCategoria">Categoria</label><select id="pCategoria"></select></div>
      <div><label for="pSub">Subcategoria <span class="dica">opcional — ex.: Risoles</span></label><input type="text" id="pSub" maxlength="40" list="listaSubs"><datalist id="listaSubs"></datalist></div>
      <div><label for="pUnidade">Vendido por</label><select id="pUnidade"><option value="kg">Quilo (kg)</option><option value="un">Unidade</option><option value="cento">Cento</option><option value="embalagem">Embalagem</option><option value="porcao">Porção</option></select></div>
    </div>
    <div class="grade" style="margin-top:12px">
      <div><label for="pMin">Quantidade mínima</label><input type="text" id="pMin" inputmode="decimal" value="1"></div>
      <div><label for="pInc">Aumenta de quanto em quanto</label><input type="text" id="pInc" inputmode="decimal" value="1"></div>
      <div><label for="pMax">Máximo <span class="dica">opcional</span></label><input type="text" id="pMax" inputmode="decimal"></div>
      <div><label for="pOrdem">Ordem na lista</label><input type="number" id="pOrdem" value="0"></div>
      <div><label for="pAntec">Antecedência (dias) <span class="dica">opcional — vazio usa a regra geral</span></label><input type="number" id="pAntec" min="0" max="60" placeholder="geral"></div>
    </div>
    <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
      <label class="check"><input type="checkbox" id="pEstimado"> Valor estimado (confirmado após a pesagem)</label>
      <label class="check"><input type="checkbox" id="pDestaque"> Destaque do Natal (aparece em "Destaques" no topo)</label>
      <div><label for="pSelo">Selo no cartão <span class="dica">opcional, curto — ex.: CLÁSSICO, NOVIDADE</span></label><input type="text" id="pSelo" maxlength="20"></div>
      <label class="check"><input type="checkbox" id="pAtivo" checked> Disponível na loja</label>
      <label class="check"><input type="checkbox" id="pEsgotado"> Esgotado (aparece em cinza, sem poder pedir)</label>
    </div>
    <div id="pErro" class="msg erro" hidden></div>
    <div class="rodape">
      <button type="button" class="btn perigo" id="pExcluir" hidden>Excluir</button>
      <span style="flex:1"></span>
      <button type="button" class="btn sec" id="pCancelar">Cancelar</button>
      <button type="submit" class="btn" id="pSalvar">Salvar produto</button>
    </div>
  </form>
</dialog>

<!-- Edição de pedido -->
<dialog id="dlgPedido" style="width:min(860px,calc(100% - 24px))">
  <form method="dialog" id="formPedido" novalidate>
    <h2 id="dlgPedidoTitulo">Editar pedido</h2>
    <div class="grade">
      <div><label for="ePNome">Cliente *</label><input type="text" id="ePNome" maxlength="120"></div>
      <div><label for="ePWpp">WhatsApp</label><input type="tel" id="ePWpp" maxlength="30"></div>
      <div><label for="ePData">Data *</label><input type="date" id="ePData"></div>
      <div><label for="ePHora">Horário <span class="dica">opcional</span></label><input type="text" id="ePHora" maxlength="60"></div>
      <div><label for="ePMod">Recebimento</label><select id="ePMod"><option value="retirada">Retirada na loja</option><option value="entrega">Entrega</option></select></div>
      <div><label for="ePPag">Pagamento</label><input type="text" id="ePPag" maxlength="80" placeholder="A combinar"></div>
    </div>
    <div class="grade" id="ePEntrega" style="margin-top:12px">
      <div><label for="ePEnd">Endereço</label><input type="text" id="ePEnd" maxlength="300"></div>
      <div><label for="ePBairro">Bairro</label><input type="text" id="ePBairro" maxlength="120"></div>
      <div><label for="ePRef">Referência</label><input type="text" id="ePRef" maxlength="200"></div>
    </div>
    <h2 style="margin-top:18px">Itens</h2>
    <div class="tabela"><table><thead><tr><th>Produto</th><th style="width:130px">Quantidade</th><th>Observação do item</th><th class="num">Subtotal</th><th></th></tr></thead><tbody id="ePItens"></tbody></table></div>
    <div class="barra-acoes" style="margin-top:10px"><div class="cresce"><label for="ePNovo">Adicionar produto</label><select id="ePNovo"></select></div><button type="button" class="btn sec" id="ePAdd">+ Adicionar</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px">
      <label class="check"><input type="checkbox" id="ePFinal"> Quantidades já pesadas — valor final (não estimado)</label>
      <div style="font-size:20px;font-weight:700">Total: <span id="ePTotal">R$ 0,00</span></div>
    </div>
    <div class="grade" style="margin-top:14px">
      <div><label for="ePObsCli">Observações do cliente</label><textarea id="ePObsCli" maxlength="600"></textarea></div>
      <div><label for="ePObsCoz">Observação para a cozinha <span class="dica">sai em destaque no formulário</span></label><textarea id="ePObsCoz" maxlength="600" style="border-color:var(--dourado)"></textarea></div>
    </div>
    <div id="ePErro" class="msg erro" hidden></div>
    <div class="rodape">
      <button type="button" class="btn sec" id="ePCancelar">Cancelar</button>
      <button type="button" class="btn sec" id="ePSalvarImprimir">Salvar e imprimir</button>
      <button type="submit" class="btn" id="ePSalvar">Salvar alterações</button>
    </div>
  </form>
</dialog>

<!-- Formulário de categoria -->
<dialog id="dlgCategoria">
  <form method="dialog" id="formCategoria" novalidate>
    <h2 id="dlgCategoriaTitulo">Categoria</h2>
    <div><label for="cNome">Nome *</label><input type="text" id="cNome" maxlength="60" required></div>
    <div class="grade" style="margin-top:12px">
      <div><label for="cIcone">Ícone</label><select id="cIcone"></select></div>
      <div><label for="cOrdem">Ordem</label><input type="number" id="cOrdem" value="0"></div>
    </div>
    <div style="margin-top:8px" id="cPrevia"></div>
    <label class="check" style="margin-top:12px"><input type="checkbox" id="cAtivo" checked> Visível na loja</label>
    <div id="cErro" class="msg erro" hidden></div>
    <div class="rodape">
      <button type="button" class="btn sec" id="cCancelar">Cancelar</button>
      <button type="submit" class="btn">Salvar categoria</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";
  var CFG = window.DM_CONFIG;
  var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
  var main = document.getElementById("main");
  var S = { usuario:null, aba:"pedidos", categorias:[], produtos:[], config:{} };
  var STATUS = [
    ["aguardando","Aguardando confirmação"],["confirmado","Confirmado"],["preparacao","Em preparação"],
    ["pronto","Pronto para retirada"],["saiu","Saiu para entrega"],["concluido","Concluído"],["cancelado","Cancelado"]
  ];
  var STATUS_PRODUCAO = ["confirmado","preparacao","pronto","saiu","concluido"];
  var NOMES_ICONES = {cloche:"Prato servido",panela:"Panela",salada:"Salada",salgado:"Salgado",doce:"Doce / bolo",kit:"Cesta / kit",talheres:"Talheres"};

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function reais(c){ return (c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
  function numBR(n){ return Number(n).toLocaleString("pt-BR",{maximumFractionDigits:3}); }
  function lerNum(s){ if (s == null) return NaN; s = String(s).trim().replace(/\s/g,""); if (!s) return NaN; if (s.indexOf(",") >= 0) s = s.replace(/\./g,"").replace(",","."); return Number(s); }
  function unid(u){ return {kg:"kg", cento:"cento(s)", embalagem:"emb.", porcao:"porç."}[u] || "un"; }
  function hojeISO(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function dataBR(iso){ if (!iso) return ""; var p = iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}); }
  function dataHora(ts){ return new Date(ts).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
  function statusNome(s){ if (s === "alterado") return "Pedido alterado"; for (var i=0;i<STATUS.length;i++) if (STATUS[i][0]===s) return STATUS[i][1]; return s; }
  function catPorId(id){ for (var i=0;i<S.categorias.length;i++) if (S.categorias[i].id === id) return S.categorias[i]; return null; }
  function soDig(s){ return String(s||"").replace(/\D/g,""); }
  function erroTxt(e){
    var m = (e && e.message) || String(e);
    if (/duplicate key.*codigo/i.test(m)) return "Já existe um produto com esse código de vendas.";
    if (/duplicate key.*nome/i.test(m)) return "Já existe uma categoria com esse nome.";
    if (/row-level security|permission denied/i.test(m)) return "Seu usuário não tem permissão para essa ação.";
    if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
    if (/Email not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
    if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique a internet.";
    return m;
  }

  /* ================= LOGIN ================= */
  function telaLogin(aviso, modo){
    modo = modo || "entrar";
    document.getElementById("abas").hidden = true;
    document.getElementById("usuario").hidden = true;
    var h = '<div class="login card"><h1>' + (modo === "criar" ? "Primeiro acesso" : (modo === "nova" ? "Definir nova senha" : "Entrar no painel")) + '</h1>';
    if (aviso) h += '<div class="msg ' + (aviso.tipo || "info") + '">' + esc(aviso.texto) + '</div>';
    h += '<form id="formLogin" novalidate>';
    if (modo !== "nova") h += '<label for="lEmail">E-mail</label><input type="email" id="lEmail" autocomplete="email" required>';
    if (modo !== "esqueci") h += '<label for="lSenha" style="margin-top:12px">' + (modo === "entrar" ? "Senha" : "Nova senha <span class=dica>(mínimo 8 caracteres)</span>") + '</label><input type="password" id="lSenha" autocomplete="' + (modo === "entrar" ? "current-password" : "new-password") + '" required>';
    h += '<div id="lErro" class="msg erro" hidden></div>';
    var rot = {entrar:"Entrar", criar:"Criar minha senha", esqueci:"Enviar link para redefinir", nova:"Salvar nova senha"}[modo];
    h += '<button class="btn" type="submit" style="width:100%;margin-top:14px">' + rot + '</button></form>';
    if (modo === "entrar") h += '<p style="margin:14px 0 0;font-size:14px"><a href="#" data-modo="criar">Primeiro acesso? Crie sua senha</a> · <a href="#" data-modo="esqueci">Esqueci a senha</a></p>';
    else if (modo !== "nova") h += '<p style="margin:14px 0 0;font-size:14px"><a href="#" data-modo="entrar">← Voltar para entrar</a></p>';
    h += '<p class="dica" style="margin-top:14px">Somente e-mails cadastrados na equipe têm acesso.</p></div>';
    main.innerHTML = h;
    main.querySelectorAll("[data-modo]").forEach(function(a){ a.onclick = function(ev){ ev.preventDefault(); telaLogin(null, a.dataset.modo); }; });
    document.getElementById("formLogin").onsubmit = function(ev){
      ev.preventDefault();
      var em = document.getElementById("lEmail"), se = document.getElementById("lSenha"), er = document.getElementById("lErro");
      var email = em ? em.value.trim() : "", senha = se ? se.value : "";
      er.hidden = true;
      function falha(e){ er.textContent = erroTxt(e); er.hidden = false; }
      if (modo === "entrar") {
        sb.auth.signInWithPassword({email:email, password:senha}).then(function(r){ if (r.error) return falha(r.error); iniciar(); });
      } else if (modo === "criar") {
        if (senha.length < 8) return falha("A senha precisa ter pelo menos 8 caracteres.");
        sb.auth.signUp({email:email, password:senha, options:{emailRedirectTo: location.href.split("#")[0]}}).then(function(r){
          if (r.error) return falha(r.error);
          if (r.data && r.data.session) return iniciar();
          telaLogin({tipo:"ok", texto:"Pronto! Enviamos um e-mail para " + email + ". Abra o link para confirmar e depois entre com sua senha."});
        });
      } else if (modo === "esqueci") {
        sb.auth.resetPasswordForEmail(email, {redirectTo: location.href.split("#")[0]}).then(function(r){
          if (r.error) return falha(r.error);
          telaLogin({tipo:"ok", texto:"Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha."});
        });
      } else if (modo === "nova") {
        if (senha.length < 8) return falha("A senha precisa ter pelo menos 8 caracteres.");
        sb.auth.updateUser({password:senha}).then(function(r){ if (r.error) return falha(r.error); iniciar(); });
      }
    };
  }

  function iniciar(){
    sb.auth.getUser().then(function(r){
      var u = r.data && r.data.user;
      if (!u) return telaLogin();
      S.usuario = u;
      return sb.from("equipe").select("email,nome,papel").then(function(q){
        var eu = (q.data || []).filter(function(x){ return x.email.toLowerCase() === (u.email||"").toLowerCase(); })[0];
        if (q.error || !eu) {
          sb.auth.signOut();
          return telaLogin({tipo:"erro", texto:"O e-mail " + u.email + " não está cadastrado na equipe. Peça a um administrador para incluir você."});
        }
        document.getElementById("usuarioEmail").textContent = eu.nome || u.email;
        document.getElementById("usuario").hidden = false;
        document.getElementById("abas").hidden = false;
        return carregarBase().then(function(){ abrirAba(S.aba); iniciarAlertas(); });
      });
    });
  }
  document.getElementById("btnSair").onclick = function(){ sb.auth.signOut().then(function(){ telaLogin({tipo:"ok", texto:"Você saiu do painel."}); }); };
  sb.auth.onAuthStateChange(function(ev){ if (ev === "PASSWORD_RECOVERY") telaLogin(null, "nova"); });

  function carregarBase(){
    return Promise.all([
      sb.from("categorias").select("*").order("ordem").order("nome"),
      sb.from("produtos").select("*").order("ordem").order("nome"),
      sb.from("configuracoes").select("chave,valor")
    ]).then(function(r){
      S.categorias = r[0].data || []; S.produtos = r[1].data || [];
      S.config = {}; (r[2].data || []).forEach(function(c){ S.config[c.chave] = c.valor; });
    });
  }

  /* ================= ABAS ================= */
  document.querySelectorAll("[data-aba]").forEach(function(b){ b.onclick = function(){ abrirAba(b.dataset.aba); }; });
  function abrirAba(a){
    S.aba = a;
    document.querySelectorAll("[data-aba]").forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.aba === a)); });
    ({pedidos:abaPedidos, producao:abaProducao, produtos:abaProdutos, config:abaConfig})[a]();
  }

  /* ================= PEDIDOS ================= */
  var filtroPed = { de: hojeISO(), ate: "", status: "", horario: "" };
  function abaPedidos(){
    var h = '<h1>Pedidos</h1><div class="card nao-imprimir"><div class="barra-acoes">';
    h += '<div><label for="fDe">Data de entrega — de</label><input type="date" id="fDe" value="' + esc(filtroPed.de) + '"></div>';
    h += '<div><label for="fAte">até <span class="dica">opcional</span></label><input type="date" id="fAte" value="' + esc(filtroPed.ate) + '"></div>';
    h += '<div><label for="fSt">Situação</label><select id="fSt"><option value="">Todas</option>' + STATUS.map(function(s){ return '<option value="' + s[0] + '"' + (filtroPed.status === s[0] ? " selected" : "") + '>' + s[1] + '</option>'; }).join("") + '</select></div>';
    var fx = ordemFaixas();
    if (fx.length) h += '<div><label for="fHor">Faixa de horário</label><select id="fHor"><option value="">Todas</option>' + fx.map(function(f){ return '<option' + (filtroPed.horario === f ? " selected" : "") + '>' + esc(f) + '</option>'; }).join("") + '</select></div>';
    h += '<button class="btn sec" id="fAtualizar" type="button">Atualizar</button></div></div><div id="listaPedidos"><p class="vazio">Carregando pedidos…</p></div>';
    main.innerHTML = h;
    ["fDe","fAte","fSt","fHor"].forEach(function(id){ var el = document.getElementById(id); if (el) el.onchange = function(){ filtroPed.de = document.getElementById("fDe").value; filtroPed.ate = document.getElementById("fAte").value; filtroPed.status = document.getElementById("fSt").value; var fh = document.getElementById("fHor"); filtroPed.horario = fh ? fh.value : ""; carregarPedidos(); }; });
    document.getElementById("fAtualizar").onclick = carregarPedidos;
    carregarPedidos();
  }
  function carregarPedidos(){
    var q = sb.from("pedidos").select("*, pedido_itens(*), pedido_historico(status,por,em)").order("data_desejada").order("criado_em");
    if (filtroPed.de) q = q.gte("data_desejada", filtroPed.de);
    if (filtroPed.ate) q = q.lte("data_desejada", filtroPed.ate);
    if (filtroPed.status) q = q.eq("status", filtroPed.status);
    if (filtroPed.horario) q = q.eq("horario", filtroPed.horario);
    q.then(function(r){
      var box = document.getElementById("listaPedidos"); if (!box) return;
      if (r.error) { box.innerHTML = '<div class="msg erro">' + esc(erroTxt(r.error)) + '</div>'; return; }
      var ps = r.data || [];
      if (!ps.length) { box.innerHTML = '<p class="vazio">Nenhum pedido encontrado para esse filtro.</p>'; return; }
      var total = 0; ps.forEach(function(p){ if (p.status !== "cancelado") total += p.total_centavos; });
      ultimosPedidos = ps;
      var h = '<div class="barra-acoes" style="align-items:center"><p class="dica cresce" style="margin:0">' + ps.length + ' pedido(s) · ' + reais(total) + ' (sem cancelados)</p>';
      h += '<button class="btn sec" type="button" id="imprimirTodos">🖨 Imprimir os ' + ps.length + ' pedido(s) listados</button></div>';
      ps.forEach(function(p){ h += cartaoPedido(p); });
      box.innerHTML = h;
      box.querySelectorAll("select[data-status]").forEach(function(sel){ sel.onchange = function(){ mudarStatus(+sel.dataset.status, sel.value, sel); }; });
      document.getElementById("imprimirTodos").onclick = function(){ imprimirPedidos(ultimosPedidos); };
      box.querySelectorAll("[data-editped]").forEach(function(b){ b.onclick = function(){ abrirEdicao(ultimosPedidos.filter(function(p){ return p.id === +b.dataset.editped; })[0]); }; });
      box.querySelectorAll("[data-imprimir]").forEach(function(b){ b.onclick = function(){ imprimirPedidos(ultimosPedidos.filter(function(p){ return p.id === +b.dataset.imprimir; })); }; });
    });
  }
  function cartaoPedido(p){
    var h = '<div class="pedido"><div class="topo"><div><span class="num">' + esc(p.numero) + '</span> <span class="tag st-' + p.status + '">' + esc(statusNome(p.status)) + '</span>' + (p.alterado_em ? ' <span class="tag" title="Alterado em ' + esc(dataHora(p.alterado_em)) + '">✎ alterado</span>' : '');
    h += '<div class="meta">' + esc(dataBR(p.data_desejada)) + (p.horario ? " · " + esc(p.horario) : "") + ' · ' + (p.modalidade === "entrega" ? "Entrega" : "Retirada") + ' · feito em ' + esc(dataHora(p.criado_em)) + '</div></div>';
    h += '<div style="text-align:right"><div style="font-weight:700;font-size:18px">' + reais(p.total_centavos) + '</div>' + (p.total_estimado ? '<div class="meta">estimado</div>' : '') + '</div></div>';
    h += '<div style="margin-top:6px"><strong>' + esc(p.cliente_nome) + '</strong> · <a href="https://wa.me/' + (soDig(p.cliente_whatsapp).length <= 11 ? "55" : "") + soDig(p.cliente_whatsapp) + '" target="_blank" rel="noopener">' + esc(p.cliente_whatsapp) + '</a>' + (p.vendedor ? ' · vendedor: ' + esc(p.vendedor) : '') + '</div>';
    if (p.modalidade === "entrega") h += '<div class="meta">' + esc(p.endereco || "") + ' — ' + esc(p.bairro || "") + (p.referencia ? " (Ref.: " + esc(p.referencia) + ")" : "") + '</div>';
    h += '<div class="barra-acoes" style="margin:10px 0 0"><div class="cresce" style="max-width:280px"><label>Mudar situação</label><select data-status="' + p.id + '">' + STATUS.map(function(s){ return '<option value="' + s[0] + '"' + (s[0] === p.status ? " selected" : "") + '>' + s[1] + '</option>'; }).join("") + '</select></div><button class="btn" type="button" data-editped="' + p.id + '">✎ Editar pedido</button><button class="btn sec" type="button" data-imprimir="' + p.id + '">🖨 Imprimir formulário</button></div>';
    if (p.obs_cozinha) h += '<div class="msg info" style="margin:10px 0 0">Cozinha: ' + esc(p.obs_cozinha) + '</div>';
    h += '<details><summary>Ver itens (' + (p.pedido_itens || []).length + ')</summary><div class="tabela"><table><thead><tr><th>Código</th><th>Produto</th><th class="num">Qtd.</th><th class="num">Subtotal</th></tr></thead><tbody>';
    (p.pedido_itens || []).forEach(function(i){ h += '<tr><td>' + esc(i.codigo) + '</td><td>' + esc(i.nome) + (i.observacao ? '<div class="meta">Obs.: ' + esc(i.observacao) + '</div>' : '') + '</td><td class="num">' + numBR(i.quantidade) + ' ' + unid(i.unidade) + '</td><td class="num">' + reais(i.subtotal_centavos) + '</td></tr>'; });
    h += '</tbody></table></div>';
    if (p.pagamento) h += '<p class="meta">Pagamento: ' + esc(p.pagamento) + '</p>';
    if (p.observacoes) h += '<p class="meta">Observações: ' + esc(p.observacoes) + '</p>';
    var hist = (p.pedido_historico || []).slice().sort(function(a,b){ return a.em < b.em ? -1 : 1; });
    if (hist.length) h += '<p class="meta">Histórico: ' + hist.map(function(x){ return esc(statusNome(x.status)) + ' (' + esc(dataHora(x.em)) + (x.por ? ', ' + esc(x.por) : '') + ')'; }).join(" → ") + '</p>';
    h += '</details></div>';
    return h;
  }
  /* ---------- Edição de pedido ---------- */
  var dlgE = document.getElementById("dlgPedido"), pedEdit = null, itensEdit = [];
  function qtdParaTexto(n){ return Number(n).toLocaleString("pt-BR",{maximumFractionDigits:3}); }
  function abrirEdicao(p){
    if (!p) return;
    pedEdit = p;
    document.getElementById("dlgPedidoTitulo").textContent = "Editar pedido " + p.numero;
    var v = function(id, val){ document.getElementById(id).value = val == null ? "" : val; };
    v("ePNome", p.cliente_nome); v("ePWpp", p.cliente_whatsapp); v("ePData", p.data_desejada); v("ePHora", p.horario);
    v("ePMod", p.modalidade); v("ePPag", p.pagamento); v("ePEnd", p.endereco); v("ePBairro", p.bairro); v("ePRef", p.referencia);
    v("ePObsCli", p.observacoes); v("ePObsCoz", p.obs_cozinha);
    document.getElementById("ePFinal").checked = !p.total_estimado && (p.pedido_itens || []).some(function(i){ var pr = prodPorCodigo(i.codigo); return pr && pr.valor_estimado; });
    itensEdit = (p.pedido_itens || []).map(function(i){ return {codigo:i.codigo, nome:i.nome, unidade:i.unidade, preco:i.preco_centavos, qtd:Number(i.quantidade), obs:i.observacao || ""}; });
    document.getElementById("ePNovo").innerHTML = '<option value="">— escolha o produto —</option>' + S.categorias.concat([{id:null, nome:"Outros"}]).map(function(c){
      var ps = S.produtos.filter(function(x){ return c.id === null ? !catPorId(x.categoria_id) : x.categoria_id === c.id; });
      if (!ps.length) return "";
      return '<optgroup label="' + esc(c.nome) + '">' + ps.map(function(x){ return '<option value="' + esc(x.codigo) + '">' + esc(x.codigo + " — " + x.nome + " (" + reais(x.preco_centavos) + "/" + unid(x.unidade) + ")") + (x.ativo ? "" : " [fora da loja]") + '</option>'; }).join("") + '</optgroup>';
    }).join("");
    document.getElementById("ePErro").hidden = true;
    mostrarEntregaEdit(); desenharItensEdit();
    dlgE.showModal();
  }
  function prodPorCodigo(c){ for (var i=0;i<S.produtos.length;i++) if (S.produtos[i].codigo === c) return S.produtos[i]; return null; }
  function mostrarEntregaEdit(){ document.getElementById("ePEntrega").hidden = document.getElementById("ePMod").value !== "entrega"; }
  document.getElementById("ePMod").onchange = mostrarEntregaEdit;
  function totalEdit(){ return itensEdit.reduce(function(a,i){ return a + (i.qtd > 0 ? Math.round(i.qtd * i.preco) : 0); }, 0); }
  function desenharItensEdit(){
    var tb = document.getElementById("ePItens");
    tb.innerHTML = itensEdit.length ? itensEdit.map(function(i, k){
      return '<tr><td><strong>' + esc(i.nome) + '</strong><div class="dica">' + esc(i.codigo) + ' · ' + reais(i.preco) + '/' + unid(i.unidade) + '</div></td>' +
        '<td><div style="display:flex;align-items:center;gap:6px"><input type="text" inputmode="decimal" data-q="' + k + '" value="' + esc(qtdParaTexto(i.qtd)) + '" style="min-height:40px"><span class="dica" style="margin:0">' + unid(i.unidade) + '</span></div></td>' +
        '<td><input type="text" data-o="' + k + '" maxlength="300" value="' + esc(i.obs) + '" placeholder="Ex.: sem passas" style="min-height:40px"></td>' +
        '<td class="num" data-s="' + k + '">' + (i.qtd > 0 ? reais(Math.round(i.qtd * i.preco)) : '<span style="color:var(--erro)">inválido</span>') + '</td>' +
        '<td><button type="button" class="btn perigo peq" data-rm="' + k + '" aria-label="Remover ' + esc(i.nome) + '">Remover</button></td></tr>';
    }).join("") : '<tr><td colspan="5" class="vazio">Nenhum item. Adicione pelo menos um produto.</td></tr>';
    document.getElementById("ePTotal").textContent = reais(totalEdit());
    tb.querySelectorAll("[data-q]").forEach(function(inp){ inp.oninput = function(){
      var k = +inp.dataset.q, n = lerNum(inp.value); itensEdit[k].qtd = n > 0 ? n : 0;
      document.querySelector('[data-s="' + k + '"]').innerHTML = n > 0 ? reais(Math.round(n * itensEdit[k].preco)) : '<span style="color:var(--erro)">inválido</span>';
      document.getElementById("ePTotal").textContent = reais(totalEdit());
    }; });
    tb.querySelectorAll("[data-o]").forEach(function(inp){ inp.oninput = function(){ itensEdit[+inp.dataset.o].obs = inp.value; }; });
    tb.querySelectorAll("[data-rm]").forEach(function(b){ b.onclick = function(){ itensEdit.splice(+b.dataset.rm, 1); desenharItensEdit(); }; });
  }
  document.getElementById("ePAdd").onclick = function(){
    var c = document.getElementById("ePNovo").value; if (!c) return;
    var ja = itensEdit.filter(function(i){ return i.codigo === c; })[0];
    if (ja) { ja.qtd = Math.round((ja.qtd + Number(prodPorCodigo(c).incremento)) * 1000) / 1000; }
    else { var x = prodPorCodigo(c); itensEdit.push({codigo:x.codigo, nome:x.nome, unidade:x.unidade, preco:x.preco_centavos, qtd:Number(x.minimo), obs:""}); }
    document.getElementById("ePNovo").value = ""; desenharItensEdit();
  };
  document.getElementById("ePCancelar").onclick = function(){ dlgE.close(); };
  function salvarEdicao(imprimir){
    var er = document.getElementById("ePErro"); er.hidden = true;
    function falha(m){ er.textContent = m; er.hidden = false; }
    var g = function(id){ return document.getElementById(id).value.trim(); };
    if (!g("ePNome")) return falha("Informe o nome do cliente.");
    if (!g("ePData")) return falha("Informe a data.");
    if (!itensEdit.length) return falha("O pedido precisa ter pelo menos um item.");
    if (itensEdit.some(function(i){ return !(i.qtd > 0); })) return falha("Há item com quantidade inválida. Use, por exemplo, 1,5.");
    var mod = g("ePMod");
    if (mod === "entrega" && (!g("ePEnd") || !g("ePBairro"))) return falha("Para entrega, informe endereço e bairro.");
    var dados = { cliente_nome:g("ePNome"), cliente_whatsapp:g("ePWpp"), data_desejada:g("ePData"), horario:g("ePHora"), modalidade:mod, pagamento:g("ePPag"),
      endereco:g("ePEnd"), bairro:g("ePBairro"), referencia:g("ePRef"), observacoes:g("ePObsCli"), obs_cozinha:g("ePObsCoz"),
      valor_final: document.getElementById("ePFinal").checked,
      itens: itensEdit.map(function(i){ return {codigo:i.codigo, quantidade:i.qtd, observacao:i.obs}; }) };
    var b1 = document.getElementById("ePSalvar"), b2 = document.getElementById("ePSalvarImprimir"); b1.disabled = b2.disabled = true;
    var id = pedEdit.id;
    sb.rpc("editar_pedido", {p_pedido_id: id, dados: dados}).then(function(r){
      b1.disabled = b2.disabled = false;
      if (r.error) return falha(erroTxt(r.error));
      dlgE.close();
      sb.from("pedidos").select("*, pedido_itens(*), pedido_historico(status,por,em)").eq("id", id).then(function(q){
        var novo = q.data && q.data[0];
        if (novo) ultimosPedidos = ultimosPedidos.map(function(p){ return p.id === id ? novo : p; });
        if (imprimir && novo) imprimirPedidos([novo]);
        carregarPedidos();
      });
    });
  }
  document.getElementById("formPedido").onsubmit = function(ev){ ev.preventDefault(); salvarEdicao(false); };
  document.getElementById("ePSalvarImprimir").onclick = function(){ salvarEdicao(true); };

  /* ---------- Impressão dos pedidos (formulário, um por folha) ---------- */
  var ultimosPedidos = [];
  function formularioPedido(p){
    var dt = new Date(p.data_desejada + "T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
    var entrega = p.modalidade === "entrega";
    var c = function(rot, val, cls){ return '<div class="campo' + (cls ? ' ' + cls : '') + '"><span>' + rot + '</span><b>' + (val ? esc(val) : '&nbsp;') + '</b></div>'; };
    var h = '<section class="ficha">';
    h += '<div class="cab"><div class="loja">Di Mercatto<small>Formulário de encomenda</small></div><div class="numero">Pedido nº<b>' + esc(p.numero) + '</b>' + esc(statusNome(p.status)) + '</div></div>';
    if (p.alterado_em) h += '<div class="alterado">✎ PEDIDO ALTERADO em ' + esc(dataHora(p.alterado_em)) + (p.alterado_por ? ' por ' + esc(p.alterado_por) : '') + ' — versão ' + (p.versao || 2) + '. Descarte a via anterior.</div>';

  var prDe = "", prAte = "", datasComPedido = {};
  function isoMais(iso, dias){ var p = iso.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()+dias); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function abaProducao(){
    var h = '<h1>Ordem de produção</h1><div class="card nao-imprimir">';

    main.innerHTML = h;
    document.getElementById("prDe").onchange = function(){ prDe = this.value; if (!prAte || prAte < prDe) { prAte = prDe; document.getElementById("prAte").value = prAte; } atualizarProducao(); };
    document.getElementById("prAte").onchange = function(){ prAte = this.value; if (prAte && prAte < prDe) { prDe = prAte; document.getElementById("prDe").value = prDe; } atualizarProducao(); };
    document.getElementById("prImprimir").onclick = function(){ window.print(); };
    sb.from("pedidos").select("data_desejada,status").gte("data_desejada", hojeISO()).neq("status","cancelado").order("data_desejada").then(function(r){
      datasComPedido = {};
      (r.data || []).forEach(function(p){ var d = datasComPedido[p.data_desejada] || (datasComPedido[p.data_desejada] = {conf:0, prev:0}); if (p.status === "aguardando") d.prev++; else d.conf++; });
      var lista = Object.keys(datasComPedido).sort();
      if (!prDe) { prDe = lista[0] || hojeISO(); prAte = prDe; }
      atualizarProducao();

  function definirPeriodo(de, ate){ prDe = de; prAte = ate; atualizarProducao(); }
  function atualizarProducao(){
    var a = document.getElementById("prDe"), b = document.getElementById("prAte"); if (!a) return;
    a.value = prDe; b.value = prAte;
    var lista = Object.keys(datasComPedido).sort();

    at.innerHTML = '<label>Período</label><div class="chips">' + botao("Próximos 7 dias", semana) + botao("Semana do Natal (20 a 31/12)", natal) + botao("Todas as datas com pedidos", todas) + '</div>';

      var x = datasComPedido[d], sel = d === prDe && d === prAte;
      return '<button type="button" class="btn ' + (sel ? '' : 'sec ') + 'peq" data-per="' + d + '|' + d + '">' + esc(dataBR(d)) + ' · ' + x.conf + ' conf.' + (x.prev ? ' + ' + x.prev + ' aguard.' : '') + '</button>';
    }).join("") + '</div>';
    document.querySelectorAll("[data-per]").forEach(function(btn){ btn.onclick = function(){ var p = btn.dataset.per.split("|"); definirPeriodo(p[0], p[1]); }; });

  var prPorHora = true;
  function ordemFaixas(){ return (Array.isArray(S.config.faixas) ? S.config.faixas : []).map(function(f){ return f.rotulo; }); }
  function tabelasProducao(pedidos, mostrarDiasPermitido){
    var mapa = {}, diasVistos = {};
    pedidos.forEach(function(p){
      var conf = STATUS_PRODUCAO.indexOf(p.status) >= 0;
      (p.pedido_itens || []).forEach(function(i){
        var k = i.codigo + "|" + i.unidade;
        if (!mapa[k]) { var prod = S.produtos.filter(function(x){ return x.codigo === i.codigo; })[0]; mapa[k] = {codigo:i.codigo, nome:i.nome, unidade:i.unidade, cat: prod ? prod.categoria_id : null, total:0, prev:0, pedidos:[], obs:[], porDia:{}}; }
        var m = mapa[k], q = Number(i.quantidade);
        if (conf) {
          m.total += q; m.pedidos.push(p.numero); if (i.observacao) m.obs.push(p.numero + ": " + i.observacao);
          m.porDia[p.data_desejada] = (m.porDia[p.data_desejada] || 0) + q; diasVistos[p.data_desejada] = 1;
        } else m.prev += q;
      });
    });
    var linhas = Object.keys(mapa).map(function(k){ return mapa[k]; });
    if (!linhas.length) return '';
    var mostrarDias = mostrarDiasPermitido && Object.keys(diasVistos).length > 1, h = '';
    var grupos = S.categorias.map(function(c){ return {cat:c, itens: linhas.filter(function(l){ return l.cat === c.id; })}; });
    grupos.push({cat:{nome:"Outros", icone:"talheres"}, itens: linhas.filter(function(l){ return !catPorId(l.cat); })});
    grupos.forEach(function(g){
      if (!g.itens.length) return;
      g.itens.sort(function(a,b){ return a.nome.localeCompare(b.nome); });
      h += '<div class="cab-setor"><span class="icone-cat">' + DM_svg(g.cat.icone, 22) + '</span>' + esc(g.cat.nome) + '</div><div class="tabela"><table><thead><tr><th>Código</th><th>Produto</th><th class="num">Total a produzir</th><th class="num">Nº pedidos</th><th class="num">Previsão (aguardando)</th></tr></thead><tbody>';
      g.itens.forEach(function(l){
        h += '<tr><td>' + esc(l.codigo) + '</td><td><strong>' + esc(l.nome) + '</strong>';
        if (mostrarDias && l.total) h += '<div class="dica">' + Object.keys(l.porDia).sort().map(function(d){ return esc(dataBR(d)) + ': ' + numBR(l.porDia[d]) + ' ' + unid(l.unidade); }).join(" · ") + '</div>';
        if (l.pedidos.length) h += '<details class="nao-imprimir"><summary class="dica">Pedidos</summary><div class="dica">' + esc(l.pedidos.join(", ")) + '</div></details>';
        if (l.obs.length) h += '<div class="dica">Obs.: ' + l.obs.map(esc).join(" · ") + '</div>';
        h += '</td><td class="num" style="font-size:17px;font-weight:700">' + (l.total ? numBR(l.total) + ' ' + unid(l.unidade) : '—') + '</td><td class="num">' + (l.pedidos.length || '—') + '</td><td class="num">' + (l.prev ? numBR(l.prev) + ' ' + unid(l.unidade) : '—') + '</td></tr>';
      });
      h += '</tbody></table></div>';
    });
    return h;
  }
  function carregarProducao(){
    var de = prDe, ate = prAte || prDe, umDia = de === ate;
    sb.from("pedidos").select("numero,status,data_desejada,horario,pedido_itens(codigo,nome,unidade,quantidade,observacao,produto_id)").gte("data_desejada", de).lte("data_desejada", ate).neq("status","cancelado").then(function(r){
      var box = document.getElementById("prConteudo"); if (!box) return;
      if (de !== prDe || ate !== (prAte || prDe)) return; // resposta antiga
      if (r.error) { box.innerHTML = '<div class="msg erro">' + esc(erroTxt(r.error)) + '</div>'; return; }
      var ps = (r.data || []).filter(function(p){ return STATUS_PRODUCAO.indexOf(p.status) >= 0 || p.status === "aguardando"; });
      var nConf = ps.filter(function(p){ return p.status !== "aguardando"; }).length, nPrev = ps.length - nConf;
      var fmt = function(iso, o){ return new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", o); };
      var titulo = umDia ? fmt(de, {weekday:"long",day:"2-digit",month:"long",year:"numeric"}) : fmt(de, {day:"2-digit",month:"2-digit"}) + " a " + fmt(ate, {day:"2-digit",month:"2-digit",year:"numeric"});
      var h = '<h2>Produção ' + (umDia ? 'para ' : 'de ') + esc(titulo) + '</h2><p class="dica">' + nConf + ' pedido(s) confirmado(s) · ' + nPrev + ' aguardando confirmação · gerado em ' + esc(new Date().toLocaleString("pt-BR")) + '</p>';
      h += '<label class="check nao-imprimir" style="margin:6px 0 4px"><input type="checkbox" id="prPorHora"' + (prPorHora ? ' checked' : '') + '> Separar por faixa de horário</label>';
      if (!ps.length) { box.innerHTML = h + '<p class="vazio">Nenhum pedido ' + (umDia ? 'para essa data' : 'nesse período') + '.</p>'; ligarPorHora(); return; }
      if (prPorHora) {
        var ordem = ordemFaixas(), chaves = [];
        ps.forEach(function(p){ var k = p.horario || "Sem horário"; if (chaves.indexOf(k) < 0) chaves.push(k); });
        chaves.sort(function(a, b){ var ia = ordem.indexOf(a), ib = ordem.indexOf(b); if (ia < 0) ia = 999; if (ib < 0) ib = 999; return ia - ib || a.localeCompare(b); });
        chaves.forEach(function(k){
          var grupo = ps.filter(function(p){ return (p.horario || "Sem horário") === k; });
          var nc = grupo.filter(function(p){ return p.status !== "aguardando"; }).length;
          h += '<div class="faixa-prod"><div class="faixa-cab">⏰ ' + esc(k) + ' <span>' + nc + ' confirmado(s)' + (grupo.length - nc ? ' · ' + (grupo.length - nc) + ' aguardando' : '') + '</span></div>' + tabelasProducao(grupo, !umDia) + '</div>';
        });
      } else h += tabelasProducao(ps, !umDia);
      box.innerHTML = h; ligarPorHora();
    });
  }
  function ligarPorHora(){ var c = document.getElementById("prPorHora"); if (c) c.onchange = function(){ prPorHora = this.checked; carregarProducao(); }; }

  function ddmmParaISO(t){
    var m = String(t).trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/); if (!m) return null;
    var hoje = new Date(), dia = +m[1], mes = +m[2], ano = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : (mes < hoje.getMonth() + 1 ? hoje.getFullYear() + 1 : hoje.getFullYear());
    if (dia < 1 || dia > 31 || mes < 1 || mes > 12) return null;
    return ano + "-" + String(mes).padStart(2,"0") + "-" + String(dia).padStart(2,"0");
  }
  function isoParaDDMM(iso){ var p = iso.split("-"); return p[2] + "/" + p[1]; }

        '<td><input type="number" min="0" data-fx="limite" data-i="' + i + '" placeholder="sem limite" value="' + (f.limite || "") + '"></td>' +
        '<td><input type="text" data-fx="datas" data-i="' + i + '" placeholder="todos os dias" value="' + esc((f.datas || []).map(isoParaDDMM).join(", ")) + '"></td>' +
        '<td><button class="btn perigo peq" type="button" data-rmfx="' + i + '">Remover</button></td></tr>';
    }).join("") : '<tr><td colspan="4" class="dica">Nenhuma faixa cadastrada.</td></tr>';
    tb.querySelectorAll("[data-fx]").forEach(function(inp){ inp.oninput = function(){
      var f = listasCfg.faixas[+inp.dataset.i], k = inp.dataset.fx;
      if (k === "rotulo") f.rotulo = inp.value;

  function salvarConfig(ev){

      var datas = f.datas || [];
      if (f.datasTxt != null) { datas = []; String(f.datasTxt).split(/[,;]+/).forEach(function(t){ if (!t.trim()) return; var iso = ddmmParaISO(t); if (iso) datas.push(iso); else erroFx = 'Data inválida na faixa "' + rot + '": ' + t.trim() + ' (use dd/mm)'; }); }

      faixasOk.push({rotulo: rot, limite: f.limite || null, datas: datas.sort()});
    });

      ["retirada_endereco", g("cfgRet")], ["entrega_ativa", document.getElementById("cfgEnt").checked], ["entrega_aviso", g("cfgEntAviso")]
    ].map(function(x){ return {chave:x[0], valor:x[1]}; });

  var ultimoId = null, timerAlerta = null, novos = [], tituloOriginal = document.title, piscar = null, audioCtx = null;

  function tocar(){
    if (!somLigado || !audioCtx) return;
    [0, 0.25, 0.5].forEach(function(t, k){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = k === 2 ? 1046 : 880;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.22);
      o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.25);
    });
  }

  function comecarPiscar(){
    if (piscar) return; var on = false;
    piscar = setInterval(function(){ on = !on; document.title = on ? "🔔 (" + novos.length + ") Novo pedido!" : tituloOriginal; }, 1000);
  }
  function pararPiscar(){ if (piscar) { clearInterval(piscar); piscar = null; } document.title = tituloOriginal; }

  /* ================= INÍCIO ================= */
  sb.auth.getSession().then(function(r){
    if (location.hash.indexOf("type=recovery") >= 0) return; // onAuthStateChange cuida
    if (r.data && r.data.session) iniciar(); else telaLogin();
  });
})();
</script>
