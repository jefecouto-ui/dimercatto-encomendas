<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encomendas Di Mercatto</title>
<meta name="description" content="Faça sua encomenda na Di Mercatto: escolha os produtos, a data e envie pelo WhatsApp.">
<meta property="og:title" content="Encomendas de Natal — Di Mercatto">
<meta property="og:description" content="Escolha seus produtos, a data e envie seu pedido pelo WhatsApp. Simples e rápido.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#94392D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --vinho:#94392D; --vinho-escuro:#6E271E; --creme:#FFEDDC; --creme-claro:#FFF7EF;
    --laranja:#E07F40; --dourado:#B8913A; --dourado-claro:#E9D7A8; --verde:#2F5D46;
    --texto:#2E211B; --texto-suave:#5C4A40; --borda:#E8D3C0; --branco:#FFFFFF;
    --erro:#B3261E; --ok:#2F5D46;
    --raio:18px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--creme-claro);color:var(--texto);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:19px;line-height:1.45}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--laranja);outline-offset:3px}
  .wrap{max-width:620px;margin:0 auto;padding:0 16px}

  /* Topo */
  header.topo{background:var(--vinho);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
  .marca{font-family:"Great Vibes",cursive;font-size:32px;line-height:1;white-space:nowrap}
  .ajuda{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--vinho);border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:16px;text-decoration:none;white-space:nowrap}
  .ajuda svg{flex:none}

  /* Etapas */
  .etapas{background:#fff;border-bottom:1px solid var(--borda)}
  .etapas ol{list-style:none;margin:0;padding:7px 0;display:flex;gap:6px;justify-content:space-between}
  .etapas li{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:600;color:var(--texto-suave);text-align:center}
  .etapas .num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--borda);background:#fff;font-weight:700;font-size:17px}
  .etapas li.atual{color:var(--vinho)}
  .etapas li.atual .num{background:var(--vinho);border-color:var(--vinho);color:#fff}
  .etapas li.feita .num{background:var(--creme);border-color:var(--vinho);color:var(--vinho)}

  .faixa-teste{background:#FFF3C4;color:#5A4500;text-align:center;font-size:13px;font-weight:600;padding:4px 16px}

  /* Abertura */
  .abertura{padding:8px 0 0;text-align:center}
  .abertura .enfeite,.abertura p.como{display:none}
  .abertura .enfeite{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--dourado);margin-bottom:6px}
  .abertura .enfeite span{display:block;height:1px;width:56px;background:var(--dourado)}
  .abertura h1{margin:0;font-family:"Great Vibes",cursive;font-weight:400;font-size:34px;line-height:1.1;color:var(--vinho)}
  .abertura p.sub{margin:0;font-size:15px;font-weight:600;color:var(--texto)}
  .abertura p.como{margin:6px auto 0;max-width:30em;color:var(--texto-suave);font-size:16px}
  .aviso-prazo{margin:16px 0 0;background:#fff;border:2px solid var(--dourado-claro);border-radius:14px;padding:12px 14px;font-weight:600}

  /* Categorias */
  .cats{position:sticky;top:60px;z-index:10;background:var(--creme-claro);padding:6px 0;margin-top:2px}
  .cats .lista{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .cats .lista::-webkit-scrollbar{display:none}
  .cat-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--vinho);background:#fff;color:var(--vinho);border-radius:999px;padding:8px 14px;font-weight:700;font-size:16px}
  .cat-btn.ativa{background:var(--vinho);color:#fff}

  section.categoria{padding-top:4px;scroll-margin-top:120px}
  section.categoria h2{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:19px;color:var(--vinho)}

  /* ===== Vitrine (proposta 8) ===== */
  .vitrine{position:relative;overflow:hidden;background:#8A3328;color:#fff;margin:0 -16px;padding:150px 22px 28px;min-height:420px;display:flex;flex-direction:column;justify-content:flex-end}
  .vitrine::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 78% 22%,#A8483A 0%,rgba(168,72,58,0) 70%)}
  .vitrine .moldura{position:absolute;inset:10px;border:1px solid rgba(233,215,168,.55);border-radius:18px;pointer-events:none}
  .vitrine .moldura+.moldura{inset:16px;border-color:rgba(233,215,168,.25);border-radius:14px}
  .vitrine .ramo{position:absolute;right:-18px;top:10px;width:190px;height:200px;opacity:.9}
  .vitrine .estrela{position:absolute;color:#E9D7A8;line-height:1}
  .vitrine .conteudo{position:relative}
  .vitrine .chip{display:inline-flex;align-items:center;gap:7px;background:#E9D7A8;color:#6E271E;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:800;white-space:nowrap}
  .vitrine .script{font-family:"Great Vibes",cursive;font-size:36px;color:#E9D7A8;line-height:1;margin-top:14px}
  .vitrine h1{margin:6px 0 0;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:38px;line-height:1.05;letter-spacing:-.4px}
  .vitrine p.txt{margin:10px 0 0;font-size:17px;line-height:1.4;color:#FFEDDC}
  .vitrine .botoes{display:flex;gap:10px;margin-top:18px}
  .vitrine .botoes a,.vitrine .botoes button{flex:1;min-height:58px;border-radius:14px;font-weight:800;font-size:17px;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 10px;line-height:1.2}
  .vitrine .b1{background:#fff;color:var(--vinho);border:0}
  .vitrine .b2{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid #fff}
  .confianca{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--vinho);color:#FFEDDC;margin:0 -16px;font-size:13px;font-weight:700;text-align:center}
  .confianca div{padding:11px 6px;border-right:1px solid rgba(255,255,255,.18)}
  .confianca div:last-child{border-right:0}
  .tit-sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 12px}
  .tit-sec h2,section.categoria .tit-sec h2{display:block;margin:0;font-family:"Playfair Display",Georgia,serif;font-size:26px;font-weight:700;color:var(--texto)}
  .tit-sec span{font-size:14px;color:var(--texto-suave);font-weight:600}
  .carrossel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none}
  .carrossel::-webkit-scrollbar{display:none}
  .carrossel .produto{flex:none;width:236px;scroll-snap-align:start}
  .carrossel .produto .arte{height:180px}
  .ceia-banner{position:relative;overflow:hidden;border-radius:22px;background:#2F5D46;color:#fff;padding:22px 20px;margin-top:18px}
  .ceia-banner::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 90% at 85% 15%,#4E7A5F 0%,rgba(78,122,95,0) 70%)}
  .ceia-banner>*{position:relative}
  .ceia-banner small{font-size:12.5px;font-weight:800;letter-spacing:1.4px;color:#E9D7A8}
  .ceia-banner h3{margin:6px 0 0;font-family:"Playfair Display",Georgia,serif;font-size:27px;line-height:1.1}
  .ceia-banner p{margin:6px 0 14px;font-size:16px;color:#E7EFE9}
  .ceia-banner button{min-height:52px;border:0;border-radius:12px;background:#E9D7A8;color:#16301F;font-weight:800;font-size:17px;padding:0 20px}
  .cat-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cat-tile{position:relative;height:118px;border-radius:18px;border:0;color:#fff;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .cat-tile svg{opacity:.95}
  .cat-tile b{font-size:15px;line-height:1.15;letter-spacing:-.2px}
  .cat-tile span{font-size:13px;font-weight:600;opacity:.9}
  .t0{background:#94392D}.t1{background:#B0703F}.t2{background:#2F5D46}.t3{background:#6E271E}
  .a0{background:radial-gradient(110% 90% at 30% 20%,#C9774F 0%,#94392D 55%,#5A2219 100%)}
  .a1{background:radial-gradient(110% 90% at 30% 20%,#F3D9B8 0%,#D9A877 55%,#9C5B3A 100%)}
  .a2{background:radial-gradient(110% 90% at 70% 20%,#8DAA80 0%,#2F5D46 60%,#16301F 100%)}
  .a3{background:radial-gradient(110% 90% at 30% 20%,#E3B98F 0%,#B0703F 55%,#6E3D22 100%)}

  /* Cartão de produto (grade) */
  .grade-prod{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .produto{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(110,39,30,.10);display:flex;flex-direction:column;border:2px solid transparent}
  .produto.no-pedido{border-color:var(--vinho)}
  .produto .arte{position:relative;height:120px;display:grid;place-items:center;color:rgba(255,255,255,.92);overflow:hidden}
  .produto .arte img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .produto .selo{position:absolute;left:8px;top:8px;background:#fff;color:var(--vinho);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;letter-spacing:.3px}
  .produto .marca-ok{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--vinho);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
  .produto .corpo{padding:10px 12px 0;flex:1}
  .produto h3{margin:0;font-size:16px;line-height:1.22;font-weight:800}
  .produto .desc{margin:3px 0 0;color:var(--texto-suave);font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .produto .preco{font-size:17px;font-weight:800;color:var(--vinho);margin-top:5px}
  .produto .preco small{font-size:13px;font-weight:600;color:var(--texto-suave)}
  .produto .nota{font-size:12.5px;color:var(--texto-suave);line-height:1.25;margin-top:2px}
  .produto .ctrl{padding:10px 12px 12px}
  .btn-add{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--vinho);color:#fff;font-weight:800;font-size:16px;padding:0 10px}
  .btn-add:active{background:var(--vinho-escuro)}
  .qtd{display:flex;align-items:center;gap:4px}
  .qtd button{width:44px;height:48px;border-radius:12px;border:2px solid var(--vinho);background:#fff;color:var(--vinho);font-size:26px;font-weight:700;line-height:1;display:grid;place-items:center;flex:none}
  .qtd button[data-acao=mais]{background:var(--vinho);color:#fff}
  .qtd .valor{flex:1;text-align:center;font-size:16px;font-weight:800;line-height:1.15}
  .qtd .valor small{display:block;font-size:12.5px;font-weight:600;color:var(--texto-suave)}
  .busca{position:relative;margin:20px 0 0}
  .busca input{width:100%;min-height:52px;border:2px solid var(--borda);border-radius:14px;padding:10px 14px 10px 44px;font-size:18px;background:#fff}
  .busca input:focus{border-color:var(--vinho);outline:none}
  .busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--texto-suave)}
  .fim-marca{text-align:center;padding:30px 10px 10px;margin-top:26px;border-top:1px solid var(--borda)}
  .fim-marca q{display:block;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:20px;color:var(--vinho);margin-top:4px}

  /* Passo a passo "Monte sua ceia" */
  .guia-topo{background:#2F5D46;color:#fff;margin:0 -16px;padding:18px 18px 16px}
  .guia-topo h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:28px}
  .guia-barras{display:grid;gap:6px;margin-top:12px}
  .guia-barras div{height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
  .guia-barras div.on{background:#E9D7A8}
  .guia-passo{font-size:13px;font-weight:800;letter-spacing:1.4px;color:#B8913A;margin-top:18px}
  .guia-tit{font-size:24px;font-weight:800;margin:2px 0 4px}
  .guia-nav{display:flex;gap:10px;margin:20px 0}
  .guia-nav button{min-height:58px;border-radius:14px;font-weight:800;font-size:17px;padding:0 14px}
  .guia-nav .voltar{flex:1;border:2px solid #2F5D46;background:#fff;color:#2F5D46}
  .guia-nav .prox{flex:2;border:0;background:#2F5D46;color:#fff}
  .sem-resultado{text-align:center;color:var(--texto-suave);padding:20px 0}

  /* Barra do carrinho */
  .barra{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;background:#2E211B;color:#fff;border-radius:18px;box-shadow:0 14px 30px rgba(0,0,0,.3);padding:8px 8px 8px 4px}
  .barra .wrap{padding:0 8px}
  .barra .wrap{display:flex;align-items:center;gap:12px}
  .barra .resumo{flex:1;font-size:13.5px;color:#E9D7A8;line-height:1.2}
  .barra .resumo strong{display:block;font-size:19px;color:#fff}
  .barra .btn-principal{background:#E07F40}
  .barra .btn-principal:disabled{background:#5C4A40;color:#CDBBA8}
  .btn-principal{min-height:60px;border:0;border-radius:16px;background:var(--vinho);color:#fff;font-weight:700;font-size:20px;padding:8px 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-align:center;line-height:1.25}
  .btn-principal:disabled{background:#C9B7AA;cursor:not-allowed}
  .btn-wpp{background:#1E7B45}
  .btn-sec{min-height:56px;border:2px solid var(--vinho);border-radius:16px;background:#fff;color:var(--vinho);font-weight:700;font-size:18px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .espaco-barra{height:96px}

  /* Formulário */
  .painel{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:18px 16px;margin:16px 0}
  .painel h2{margin:0 0 12px;font-size:23px;color:var(--vinho)}
  .titulo-etapa{margin:22px 0 4px;font-size:28px;color:var(--vinho)}
  .linha-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--borda)}
  .linha-item:last-child{border-bottom:0}
  .linha-item .n{font-weight:600}
  .linha-item .q{color:var(--texto-suave);font-size:16px}
  .linha-item .v{font-weight:700;white-space:nowrap}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:12px;border-top:2px solid var(--creme);font-size:22px;font-weight:700}
  .total small{display:block;font-size:15px;font-weight:600;color:var(--texto-suave)}
  label.campo{display:block;margin:14px 0 6px;font-weight:700}
  .dica{display:block;font-weight:500;font-size:15px;color:var(--texto-suave);margin-top:2px}
  input[type=text],input[type=tel],input[type=date],textarea{width:100%;min-height:58px;border:2px solid var(--borda);border-radius:14px;padding:12px 14px;background:#fff;font-size:19px}
  textarea{min-height:96px;resize:vertical}
  input:focus,textarea:focus{border-color:var(--vinho);outline:none;box-shadow:0 0 0 3px rgba(148,57,45,.15)}
  .erro-campo{color:var(--erro);font-weight:600;font-size:16px;margin-top:6px}
  .invalido{border-color:var(--erro)!important}
  .opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opcoes.uma{grid-template-columns:1fr}
  .opcao{min-height:64px;border:2px solid var(--borda);border-radius:14px;background:#fff;font-weight:700;font-size:18px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .opcao small{font-weight:500;font-size:14px;color:var(--texto-suave)}
  .opcao[aria-pressed=true]{border-color:var(--vinho);background:var(--creme);color:var(--vinho);box-shadow:inset 0 0 0 1px var(--vinho)}
  .acoes{display:flex;flex-direction:column;gap:12px;margin:22px 0}
  .confirmo{display:flex;gap:14px;align-items:flex-start;background:var(--creme);border-radius:14px;padding:14px;font-weight:600;cursor:pointer}
  .confirmo input{width:30px;height:30px;flex:none;accent-color:var(--vinho);margin:0}
  .aviso{background:#fff;border-left:5px solid var(--dourado);border-radius:10px;padding:12px 14px;font-size:17px;color:var(--texto)}
  .vazio{text-align:center;padding:40px 10px;color:var(--texto-suave)}
  .carregando{text-align:center;padding:60px 10px;color:var(--texto-suave);font-weight:600}
  .msg-erro{background:#FDECEA;color:var(--erro);border-radius:12px;padding:12px 14px;font-weight:600;margin:12px 0}
  .ok-num{font-size:30px;font-weight:700;color:var(--vinho);letter-spacing:.5px}
  .passo-final{display:flex;gap:14px;align-items:flex-start;margin:12px 0}
  .passo-final .b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--vinho);color:#fff;display:grid;place-items:center;font-weight:700}
  footer.rodape{text-align:center;color:var(--texto-suave);font-size:15px;padding:24px 16px 10px}

  /* Resumo lateral (só no computador) */
  .lateral{display:none}
  .lateral h2{margin:0 0 6px;font-size:22px;color:var(--vinho)}
  .lateral .linha-item{font-size:16px;padding:8px 0}
  .lateral .vazio{padding:16px 0;font-size:16px}
  .lateral .btn-principal{width:100%;margin-top:14px}

  /* Computador: mais largo, produtos em 2 colunas e pedido na lateral */
  @media (min-width:960px){
    .wrap{max-width:1180px}
    main.etapa-form{max-width:760px}
    .abertura{padding-top:28px}
    .abertura .enfeite{display:flex}.abertura p.como{display:block}
    .abertura h1{font-size:60px}
    .abertura p.sub{font-size:19px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
    .grade-prod{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
    .vitrine{margin:18px 0 0;border-radius:24px 24px 0 0;min-height:440px;padding:60px 44px 40px}
    .vitrine h1{font-size:52px;max-width:15em}
    .vitrine .ramo{width:320px;height:330px;right:20px}
    .vitrine .botoes{max-width:520px}
    .confianca{margin:0;border-radius:0 0 16px 16px}
    .cat-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
    .carrossel{margin:0;padding:0 0 14px}
    .guia-topo{margin:18px 0 0;border-radius:20px}
    .barra-cat{margin:0;top:60px}
    .subs{margin:0 0 12px;padding:2px 0}
    .lateral{display:block;position:sticky;top:150px;background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:18px;margin-top:28px;max-height:calc(100vh - 170px);overflow:auto}
    .barra,.espaco-barra{display:none!important}
    .cat-btn:hover,.btn-sec:hover{background:var(--creme)}
    .btn-add:hover,.btn-principal:not(:disabled):hover{filter:brightness(.92)}
  }

  /* Cartões compactos */
  .produto .nota{display:none}
  .cab-cat{display:none!important}
  .barra-cat + .layout .grade-prod{margin-top:10px}
  .produto{border-radius:12px}
  .carrossel .produto{width:170px}
  .carrossel .produto .arte{height:96px}
  .carrossel .produto .arte svg{width:40px;height:40px}
  .produto .arte{height:58px}
  .produto .arte svg{width:26px;height:26px}
  .produto .corpo{padding:6px 7px 0}
  .produto h3{font-size:13px;line-height:1.2}
  .produto .preco{font-size:13.5px;margin-top:2px}
  .produto .preco small{font-size:11px}
  .produto .ctrl{padding:6px 7px 8px}
  .btn-add{min-height:36px;font-size:13px;border-radius:9px;padding:0 4px}
  .qtd{gap:2px}
  .qtd button{width:28px;height:36px;font-size:18px;border-radius:9px;border-width:1.5px}
  .qtd .valor{font-size:12px;min-width:0}
  .qtd .valor small{display:none}
  .grade-prod{gap:7px}
  @media (max-width:959px){ .grade-prod{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:340px){ .grade-prod{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (min-width:960px){ .grade-prod{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px} .produto .arte{height:80px} .produto h3{font-size:14.5px} .produto .preco{font-size:15px} .btn-add{min-height:40px;font-size:14px} .qtd button{width:34px;height:40px} }
  /* Tela de categoria */
  .barra-cat{position:sticky;top:60px;z-index:12;background:var(--creme-claro);margin:0 -16px;padding:10px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--borda)}
  .barra-cat .voltar-ini{flex:none;min-height:42px;border:0;border-radius:999px;background:var(--vinho);color:#fff;font-weight:800;font-size:15px;padding:0 14px}
  .barra-cat .lista{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .barra-cat .lista::-webkit-scrollbar{display:none}
  .barra-cat .cat-btn{min-height:42px}
  .cab-cat{display:flex;align-items:center;gap:12px;color:#fff;border-radius:18px;padding:16px;margin:14px 0 12px}
  .cab-cat h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:26px;line-height:1.1}
  .cab-cat span{font-size:14px;font-weight:600;opacity:.9}
  .subs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
  .subs::-webkit-scrollbar{display:none}
  .sub-btn{flex:none;min-height:44px;border:2px solid var(--borda);background:#fff;border-radius:999px;padding:0 16px;font-weight:700;font-size:15.5px;color:var(--texto)}
  .sub-btn[aria-pressed=true]{background:var(--texto);border-color:var(--texto);color:#fff}
  .nav-cat{display:flex;flex-direction:column;gap:10px;margin:22px 0 6px}
  .busca-fixa{position:sticky;top:66px;z-index:11;margin:14px 0 0}
  .busca-fixa::before{content:"";position:absolute;inset:-8px -16px;background:var(--creme-claro);z-index:-1}
  .cat-tile span{white-space:nowrap}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header class="topo">
  <div class="wrap">
    <div class="marca" aria-label="Di Mercatto">Di Mercatto</div>
    <a class="ajuda" id="btnAjuda" href="#" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
      Ajuda
    </a>
  </div>
</header>
<div id="faixaTeste" class="faixa-teste" hidden>Versão de teste — os pedidos vão para o número de testes</div>
<nav class="etapas" aria-label="Etapas do pedido">
  <div class="wrap">
    <ol>
      <li id="et1" class="atual"><span class="num">1</span>Escolher</li>
      <li id="et2"><span class="num">2</span>Seus dados</li>
      <li id="et3"><span class="num">3</span>Enviar</li>
    </ol>
  </div>
</nav>

<main id="app" class="wrap">
  <div class="carregando">Carregando o cardápio…</div>
</main>

<footer class="rodape">Di Mercatto · Graça, Salvador — BA<br>Prefere ajuda? <a href="#" id="linkAjudaRodape" target="_blank" rel="noopener">Fale com a gente pelo WhatsApp</a></footer>
<div class="espaco-barra" id="espacoBarra" hidden></div>

<div class="barra" id="barra" hidden>
  <div class="wrap">
    <div class="resumo" id="barraResumo"></div>
    <button class="btn-principal" id="barraBtn" type="button" style="min-height:52px;font-size:18px">Continuar →</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var CFG = window.DM_CONFIG;
  var CHAVE_CARRINHO = "dm_encomenda_v1";
  var estado = {
    etapa: 1,
    categorias: [], produtos: [], config: {},
    carrinho: {},           // codigo -> {q: numero, obs: texto}
    dados: { nome:"", whatsapp:"", modalidade:"", data:"", horario:"", endereco:"", bairro:"", referencia:"", pagamento:"", observacoes:"" },
    resultado: null,
    vendedor: null,
    guia: null, cat: null, sub: null
  };

  /* ---------- utilidades ---------- */
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function reais(c){ return (c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
  function numBR(n){ return Number(n).toLocaleString("pt-BR",{maximumFractionDigits:3}); }
  function unidadeTxt(u, q){
    if (u === "kg") return "kg";
    if (u === "cento") return q === 1 ? "cento" : "centos";
    return q === 1 ? "unidade" : "unidades";
  }
  function precoUnTxt(u){ return u === "kg" ? "o kg" : (u === "cento" ? "o cento" : "a unidade"); }
  function qtdTxt(u, q){ return numBR(q) + " " + unidadeTxt(u, q); }
  function normal(t){ return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function filtrarBusca(q){
    var qn = normal(q).trim(), ini = document.getElementById("blocoInicio"), res = document.getElementById("resultadoBusca");
    if (!ini || !res) return;
    if (!qn) { ini.hidden = false; res.hidden = true; res.innerHTML = ""; return; }
    var achados = estado.produtos.filter(function(p){ return normal(p.nome + " " + (p.descricao || "") + " " + (p.subcategoria || "")).indexOf(qn) >= 0; });
    ini.hidden = true; res.hidden = false;
    res.innerHTML = '<div class="tit-sec"><h2>Resultado da busca</h2><span>' + achados.length + (achados.length === 1 ? ' item' : ' itens') + '</span></div>' +
      (achados.length ? '<div class="grade-prod">' + achados.slice(0, 60).map(function(p){ return cartao(p); }).join("") + '</div>' : '<p class="sem-resultado">Nenhum produto encontrado. Tente outra palavra.</p>');
  }
  function arred(n){ return Math.round(n*1000)/1000; }
  function subtotal(p, q){ return Math.round(q * p.preco_centavos); }
  function soDigitos(s){ return String(s||"").replace(/\D/g,""); }
  function guardar(){
    try { localStorage.setItem(CHAVE_CARRINHO, JSON.stringify({carrinho:estado.carrinho, dados:estado.dados, vendedor:estado.vendedor})); } catch(e){}
  }
  function recuperar(){
    try {
      var s = JSON.parse(localStorage.getItem(CHAVE_CARRINHO) || "null");
      if (s && s.carrinho) estado.carrinho = s.carrinho;
      if (s && s.dados) for (var k in estado.dados) if (s.dados[k] != null) estado.dados[k] = s.dados[k];
      if (s && s.vendedor) estado.vendedor = s.vendedor;
    } catch(e){}
  }
  function api(caminho, opcoes){
    opcoes = opcoes || {};
    var h = { apikey: CFG.SUPABASE_KEY, "Content-Type":"application/json" };
    return fetch(CFG.SUPABASE_URL + "/rest/v1/" + caminho, { method: opcoes.method || "GET", headers: h, body: opcoes.body ? JSON.stringify(opcoes.body) : undefined })
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) { var e = new Error((j && (j.message || j.hint)) || "Erro"); e.dados = j; throw e; } return j; }); });
  }
  function produtoPorCodigo(c){ for (var i=0;i<estado.produtos.length;i++) if (estado.produtos[i].codigo === c) return estado.produtos[i]; return null; }
  function itensCarrinho(){
    var lista = [];
    estado.produtos.forEach(function(p){ var it = estado.carrinho[p.codigo]; if (it && it.q > 0) lista.push({p:p, q:it.q, obs:it.obs||""}); });
    return lista;
  }
  function totais(){
    var t = 0, est = false, n = 0;
    itensCarrinho().forEach(function(i){ t += subtotal(i.p, i.q); est = est || i.p.valor_estimado; n++; });
    return { total:t, estimado:est, n:n };
  }
  function linkWhats(texto){
    var num = soDigitos(estado.config.whatsapp);
    return "https://wa.me/" + num + (texto ? "?text=" + encodeURIComponent(texto) : "");
  }
  function dataBR(iso){ if(!iso) return ""; var p = iso.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]); return d.toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"}); }
  function amanhaISO(){ var d = new Date(); d.setDate(d.getDate()+1); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

  /* ---------- carregar dados ---------- */
  function carregar(){
    var p = new URLSearchParams(location.search);
    if (p.get("v")) { estado.vendedor = p.get("v").slice(0,60); }
    recuperar();
    Promise.all([
      api("categorias?select=id,nome,icone,ordem&ativo=eq.true&order=ordem.asc,nome.asc"),
      api("produtos?select=codigo,nome,descricao,categoria_id,unidade,preco_centavos,minimo,incremento,maximo,valor_estimado,foto_url,ordem,destaque,selo,subcategoria&ativo=eq.true&order=ordem.asc,nome.asc"),
      api("configuracoes?select=chave,valor")
    ]).then(function(r){
      estado.categorias = r[0];
      estado.produtos = r[1].map(function(x){ x.minimo = Number(x.minimo); x.incremento = Number(x.incremento); x.maximo = x.maximo == null ? null : Number(x.maximo); return x; });
      r[2].forEach(function(c){ estado.config[c.chave] = c.valor; });
      // limpa do carrinho o que não existe mais
      Object.keys(estado.carrinho).forEach(function(c){ if (!produtoPorCodigo(c)) delete estado.carrinho[c]; });
      var ajuda = linkWhats("Olá! Gostaria de ajuda para fazer uma encomenda.");
      document.getElementById("btnAjuda").href = ajuda;
      document.getElementById("linkAjudaRodape").href = ajuda;
      document.getElementById("faixaTeste").hidden = !estado.config.modo_teste;
      if (estado.config.campanha_titulo) document.title = "Encomendas — " + estado.config.campanha_titulo;
      var mh = location.hash.match(/^#categoria-(\d+)$/); if (mh) estado.cat = +mh[1];
      irPara(1, true);
    }).catch(function(){
      document.getElementById("app").innerHTML = '<div class="msg-erro">Não conseguimos carregar o cardápio agora. Verifique sua internet e tente novamente.</div><div class="acoes"><button class="btn-principal" onclick="location.reload()">Tentar de novo</button></div>';
    });
  }

  /* ---------- navegação ---------- */
  function irPara(n, semRolar){
    estado.etapa = n;
    document.getElementById("app").className = n === 1 ? "wrap" : "wrap etapa-form";
    document.querySelector("nav.etapas").hidden = (n === 1 && estado.guia == null);
    [1,2,3].forEach(function(i){
      var li = document.getElementById("et"+i);
      li.className = i === n ? "atual" : (i < n ? "feita" : "");
      if (i === n) li.setAttribute("aria-current","step"); else li.removeAttribute("aria-current");
    });
    if (n === 1) telaCardapio();
    if (n === 2) telaDados();
    if (n === 3) telaConferir();
    if (n === 4) telaFinal();
    atualizarBarra();
    if (!semRolar) window.scrollTo(0,0);
  }

  /* ---------- etapa 1: cardápio ---------- */
  var RAMO = '<svg class="ramo" viewBox="0 0 240 250" fill="none" stroke="#D9B86A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M232 14 C170 58 118 112 74 214"/><path d="M212 28 l-6 -18 M212 28 l17 -5 M192 42 l-8 -18 M192 42 l18 -4 M172 58 l-9 -17 M172 58 l18 -2 M153 76 l-10 -16 M153 76 l18 0 M136 95 l-11 -15 M136 95 l17 2 M120 115 l-12 -14 M120 115 l17 4 M106 136 l-12 -13 M106 136 l16 6 M94 158 l-13 -11 M94 158 l15 8 M84 182 l-13 -9 M84 182 l14 9"/><path d="M160 66 v20"/><circle cx="160" cy="96" r="10" fill="#E9D7A8" stroke="none"/><path d="M118 118 v26"/><circle cx="118" cy="152" r="8" fill="#E07F40" stroke="none"/><path d="M196 40 v30"/><circle cx="196" cy="78" r="7" fill="#FFFFFF" stroke="none" opacity=".85"/></svg>';
  function abrirCategoria(id){
    var alvo = id == null ? "" : "#categoria-" + id;
    if (location.hash !== alvo) { if (alvo) location.hash = alvo; else history.pushState(null, "", location.pathname + location.search); }
    estado.cat = id; estado.sub = null; estado.guia = null; irPara(1);
    if (id == null) { var c = document.getElementById("cardapio"); if (c) c.scrollIntoView(); }
  }
  window.addEventListener("hashchange", function(){
    var m = location.hash.match(/^#categoria-(\d+)$/), id = m ? +m[1] : null;
    if (estado.etapa === 1 && id !== estado.cat) { estado.cat = id; estado.sub = null; estado.guia = null; irPara(1); }
  });
  window.addEventListener("popstate", function(){
    if (!location.hash && estado.etapa === 1 && estado.cat != null) { estado.cat = null; irPara(1); var c = document.getElementById("cardapio"); if (c) c.scrollIntoView(); }
  });
  function catsComProdutos(){ return estado.categorias.filter(function(c){ return estado.produtos.some(function(p){ return p.categoria_id === c.id; }); }); }
  function corCat(id){ var cs = estado.categorias; for (var i=0;i<cs.length;i++) if (cs[i].id === id) return i % 4; return 0; }
  function iconeCat(id){ var c = estado.categorias.filter(function(x){ return x.id === id; })[0]; return c ? c.icone : "talheres"; }
  function diasAte(iso){ if (!iso) return null; var p = iso.split("-"), alvo = new Date(+p[0], +p[1]-1, +p[2]), hoje = new Date(); hoje.setHours(0,0,0,0); return Math.round((alvo - hoje) / 86400000); }
  function chipPrazo(){
    var cfg = estado.config, d = diasAte(cfg.prazo_data);
    var rel = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    if (d != null && d >= 0) {
      var p = cfg.prazo_data.split("-"), dt = p[2] + "/" + p[1];
      return '<span class="chip">' + rel + 'ATÉ ' + dt + ' · ' + (d === 0 ? 'ÚLTIMO DIA!' : (d === 1 ? 'FALTA 1 DIA' : 'FALTAM ' + d + ' DIAS')) + '</span>';
    }
    if (cfg.prazo_aviso) return '<span class="chip">' + rel + esc(cfg.prazo_aviso) + '</span>';
    return '';
  }
  function telaCardapio(){
    if (estado.guia != null) return telaGuia();
    if (estado.cat != null && catsComProdutos().some(function(c){ return c.id === estado.cat; })) return telaCategoria();
    estado.cat = null;
    var cfg = estado.config, h = "", cats = catsComProdutos();
    var semCat = estado.produtos.filter(function(p){ return !estado.categorias.some(function(c){ return c.id === p.categoria_id; }); });
    h += '<section class="vitrine" aria-label="Apresentação"><span class="moldura"></span><span class="moldura"></span>' + RAMO;
    h += '<span class="estrela" style="left:34px;top:40px;font-size:22px" aria-hidden="true">✦</span><span class="estrela" style="left:92px;top:84px;font-size:12px;opacity:.8" aria-hidden="true">✦</span><span class="estrela" style="left:150px;top:34px;font-size:15px;opacity:.7" aria-hidden="true">✦</span>';
    h += '<div class="conteudo">' + chipPrazo();
    h += '<div class="script">' + esc(cfg.campanha_titulo || "Encomendas Di Mercatto") + '</div>';
    if (cfg.campanha_subtitulo) h += '<h1>' + esc(cfg.campanha_subtitulo) + '</h1>';
    if (cfg.campanha_texto) h += '<p class="txt">' + esc(cfg.campanha_texto) + '</p>';
    h += '<div class="botoes"><a class="b1" href="#cardapio" data-irpara="cardapio">Ver o cardápio</a>' + (cats.length > 1 ? '<button type="button" class="b2" data-guia="0">Montar minha ceia</button>' : '') + '</div>';
    h += '</div></section>';
    h += '<div class="confianca"><div>Feito na nossa<br>cozinha</div><div>' + (cfg.entrega_ativa ? 'Retirada ou<br>entrega' : 'Retirada<br>na loja') + '</div><div>Pedido em<br>3 passos</div></div>';
    h += '<div class="layout"><div class="col-produtos">';
    h += '<div class="busca busca-fixa"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="fBusca" placeholder="Buscar produto (ex.: pernil)" aria-label="Buscar produto" autocomplete="off"></div>';
    h += '<div id="resultadoBusca" hidden></div><div id="blocoInicio">';
    var dest = estado.produtos.filter(function(p){ return p.destaque; });
    if (dest.length) {
      h += '<div class="tit-sec"><h2>Destaques do Natal</h2><span>deslize →</span></div><div class="carrossel">';
      dest.forEach(function(p){ h += cartao(p, true); });
      h += '</div>';
    }
    if (!estado.produtos.length) h += '<div class="vazio">O cardápio ainda está sendo preparado. Volte em breve!</div>';
    h += '<div class="tit-sec" id="cardapio"><h2>Escolha por categoria</h2></div><div class="cat-tiles">';
    cats.forEach(function(c){ var n = estado.produtos.filter(function(p){ return p.categoria_id === c.id; }).length; h += '<button type="button" class="cat-tile t' + corCat(c.id) + '" data-abrircat="' + c.id + '">' + DM_svg(c.icone, 30) + '<div><b>' + esc(c.nome) + '</b><br><span>' + n + (n === 1 ? ' opção' : ' opções') + ' →</span></div></button>'; });
    h += '</div>';
    if (cats.length > 1) h += '<div class="ceia-banner"><small>NÃO SABE POR ONDE COMEÇAR?</small><h3>Monte sua ceia em ' + cats.length + ' passos</h3><p>' + esc(cats.map(function(c){ return c.nome; }).join(", ")) + '.</p><button type="button" data-guia="0">Começar →</button></div>';
    if (semCat.length) { h += '<div class="tit-sec"><h2>Outros</h2></div><div class="grade-prod">'; semCat.forEach(function(p){ h += cartao(p); }); h += '</div>'; }
    h += '</div>';
    h += '<div class="fim-marca"><div style="color:var(--dourado)">✦</div><q>Tudo em um só lugar, desde 2005.</q><div class="dica">Di Mercatto · Graça, Salvador</div></div>';
    h += '</div><aside class="lateral" id="lateral" aria-label="Resumo do pedido"></aside></div>';
    document.getElementById("app").innerHTML = h;
  }
  function telaCategoria(){
    var cats = catsComProdutos(), c = cats.filter(function(x){ return x.id === estado.cat; })[0], idx = cats.indexOf(c);
    var ps = estado.produtos.filter(function(p){ return p.categoria_id === c.id; });
    var subs = []; ps.forEach(function(p){ if (p.subcategoria && subs.indexOf(p.subcategoria) < 0) subs.push(p.subcategoria); });
    if (estado.sub && subs.indexOf(estado.sub) < 0) estado.sub = null;
    var vis = estado.sub ? ps.filter(function(p){ return p.subcategoria === estado.sub; }) : ps;
    var h = '<div class="barra-cat"><button type="button" class="voltar-ini" data-abrircat="inicio" aria-label="Voltar ao início">← Início</button><div class="lista">';
    cats.forEach(function(x){ h += '<button type="button" class="cat-btn' + (x.id === c.id ? ' ativa' : '') + '" data-abrircat="' + x.id + '"' + (x.id === c.id ? ' aria-current="true"' : '') + '>' + esc(x.nome) + '</button>'; });
    h += '</div></div>';
    h += '<div class="layout"><div class="col-produtos">';
    h += '<div class="cab-cat t' + corCat(c.id) + '">' + DM_svg(c.icone, 34) + '<div><h1>' + esc(c.nome) + '</h1><span>' + ps.length + (ps.length === 1 ? ' opção' : ' opções') + '</span></div></div>';
    if (subs.length > 1) {
      h += '<div class="subs" role="group" aria-label="Filtrar ' + esc(c.nome) + '"><button type="button" class="sub-btn" data-sub="" aria-pressed="' + (!estado.sub) + '">Todos</button>';
      subs.forEach(function(sb){ h += '<button type="button" class="sub-btn" data-sub="' + esc(sb) + '" aria-pressed="' + (estado.sub === sb) + '">' + esc(sb) + '</button>'; });
      h += '</div>';
    }
    h += '<div class="grade-prod">'; vis.forEach(function(p){ h += cartao(p); }); h += '</div>';
    var prox = cats[idx + 1];
    h += '<div class="nav-cat">' + (prox ? '<button type="button" class="btn-sec" data-abrircat="' + prox.id + '">Ver ' + esc(prox.nome.toLowerCase()) + ' →</button>' : '') + '<button type="button" class="btn-sec" data-abrircat="inicio">← Voltar ao início</button></div>';
    h += '</div><aside class="lateral" id="lateral" aria-label="Resumo do pedido"></aside></div>';
    document.getElementById("app").innerHTML = h;
  }
  function telaGuia(){
    var cats = catsComProdutos(), i = estado.guia;
    if (!cats.length) { estado.guia = null; return telaCardapio(); }
    if (i >= cats.length) i = estado.guia = cats.length - 1;
    var c = cats[i], h = '';
    h += '<div class="guia-topo"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Monte sua ceia</h1><button type="button" class="btn-sec" data-guia="sair" style="min-height:44px;font-size:15px;background:transparent;color:#fff;border-color:rgba(255,255,255,.7)">Sair</button></div>';
    h += '<div class="guia-barras" style="grid-template-columns:repeat(' + cats.length + ',minmax(0,1fr))">' + cats.map(function(x, k){ return '<div class="' + (k <= i ? 'on' : '') + '"></div>'; }).join('') + '</div></div>';
    h += '<div class="layout"><div class="col-produtos">';

  function controle(p, it){

  function mudarQtd(codigo, acao){
    var p = produtoPorCodigo(codigo); if (!p) return;
    var it = estado.carrinho[codigo] || {q:0, obs:""};
    if (acao === "add") it.q = p.minimo;
    else if (acao === "mais") { var nq = arred(it.q + p.incremento); if (p.maximo == null || nq <= p.maximo) it.q = nq; }
    else if (acao === "menos") { var mq = arred(it.q - p.incremento); it.q = mq < p.minimo ? 0 : mq; }
    if (it.q > 0) estado.carrinho[codigo] = it; else delete estado.carrinho[codigo];
    guardar();
    var origem = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".ctrl") : null;
    document.querySelectorAll('.ctrl[data-codigo="' + CSS.escape(codigo) + '"]').forEach(function(box){

  function montarMensagem(r){
    var d = estado.dados, L = [];
    L.push("*ENCOMENDA — DI MERCATTO*  #" + r.numero);

      L.push("- [" + i.codigo + "] " + i.nome + " — " + qtdTxt(i.unidade, q) + " — " + reais(i.preco_centavos) + " — " + reais(i.subtotal_centavos));
      if (i.observacao) L.push("   Obs.: " + i.observacao);
    });
    L.push("");
    L.push("*Total " + (r.total_estimado ? "estimado" : "final") + ": " + reais(r.total_centavos) + "*");

    L.push("");

  var enviando = false;

    h += '</div>';
    h += '<div class="acoes"><a class="btn-principal btn-wpp" href="' + esc(url) + '" target="_blank" rel="noopener">' + iconeWpp() + ' Abrir o WhatsApp com meu pedido</a>';
    h += '<button type="button" class="btn-sec" id="btnCopiar">Copiar o texto do pedido</button><div id="copiado" class="aviso" hidden>Texto copiado! Cole no WhatsApp da Di Mercatto e envie.</div></div>';
    h += '<p class="aviso">Seu pedido só é confirmado depois que você enviar a mensagem e nossa equipe responder.</p>';
    h += '<div class="acoes"><button type="button" class="btn-sec" id="btnNovo">Fazer outro pedido</button></div>';
    document.getElementById("app").innerHTML = h;
  }
  function copiar(){
    var t = estado.resultado && estado.resultado.mensagem; if (!t) return;
    var ok = function(){ document.getElementById("copiado").hidden = false; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function(){ fallback(t); ok(); });
    else { fallback(t); ok(); }
  }
  function fallback(t){ var a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch(e){} document.body.removeChild(a); }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("button, a"); if (!t) return;
    var ctrl = t.closest(".ctrl");
    if (ctrl && t.dataset.acao) { mudarQtd(ctrl.dataset.codigo, t.dataset.acao); return; }
    if (t.dataset.abrircat) { abrirCategoria(t.dataset.abrircat === "inicio" ? null : +t.dataset.abrircat); return; }
    if (t.dataset.sub != null && t.classList.contains("sub-btn")) { estado.sub = t.dataset.sub || null; telaCardapio(); atualizarBarra(); return; }
    if (t.dataset.irpara === "cardapio") { ev.preventDefault(); var c = document.getElementById("cardapio"); if (c) c.scrollIntoView({behavior:"smooth"}); return; }
    if (t.dataset.guia != null) {
      var g = t.dataset.guia;
      if (g === "sair") { estado.guia = null; irPara(1); var cc = document.getElementById("cardapio"); if (cc) cc.scrollIntoView(); return; }
      if (g === "fim") { estado.guia = null; if (totais().n) irPara(2); else irPara(1); return; }
      estado.guia = +g; irPara(1); return;
    }
    if (t.dataset.grupo) {
      lerFormulario();
      estado.dados[t.dataset.grupo] = t.dataset.valor; guardar();
      document.querySelectorAll('[data-grupo="' + t.dataset.grupo + '"]').forEach(function(b){ b.setAttribute("aria-pressed", String(b === t)); });
      if (t.dataset.grupo === "modalidade") document.getElementById("blocoEntrega").hidden = t.dataset.valor !== "entrega";
      return;
    }
    if (t.dataset.ir) { if (estado.etapa === 2) lerFormulario(); irPara(+t.dataset.ir); return; }
    if (t.id === "barraBtn" || t.id === "lateralBtn") { irPara(2); return; }
    if (t.id === "btnConferir") { if (validarDados()) irPara(3); return; }
    if (t.id === "btnEnviar") { enviar(); return; }
    if (t.id === "btnCopiar") { copiar(); return; }
    if (t.id === "btnNovo") { estado.resultado = null; try { sessionStorage.removeItem("dm_ultimo_pedido"); } catch(e){} enviando = false; irPara(1); return; }
  });
  document.addEventListener("input", function(ev){
    if (ev.target.id === "fBusca") { filtrarBusca(ev.target.value); return; }
    if (ev.target.matches("input, textarea")) { ev.target.classList.remove("invalido"); ev.target.removeAttribute("aria-invalid"); }
  });
  document.addEventListener("change", function(){ if (estado.etapa === 2) lerFormulario(); });

  carregar();
})();
</script>
</body>
</html>
